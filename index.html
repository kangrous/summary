<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 요약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1F4F5;
    --surface: #FFFFFF;
    --ink: #17222B;
    --muted: #5B6873;
    --rule: #CFD7DC;
    --accent: #0A6C74;
    --accent-ink: #FFFFFF;
    --danger: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12181D;
      --surface: #1A2229;
      --ink: #E6ECEF;
      --muted: #9AA7B0;
      --rule: #2C3841;
      --accent: #4FB8C0;
      --accent-ink: #0C1316;
      --danger: #FF8A80;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    padding: 56px 20px 96px;
    color: var(--ink);
    font: 400 16px/1.6 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
  .lead { margin: 0 0 36px; color: var(--muted); }

  label, legend { display: block; margin: 0 0 8px; font-weight: 600; font-size: 15px; padding: 0; }
  input[type="url"], input[type="text"], textarea {
    width: 100%;
    padding: 12px 14px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    font: inherit;
  }
  textarea { min-height: 160px; resize: vertical; }
  ::placeholder { color: var(--muted); opacity: .8; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  fieldset { margin: 24px 0 0; padding: 0; border: 0; }
  .formats { display: flex; flex-wrap: wrap; gap: 8px; }
  .formats input { position: absolute; opacity: 0; pointer-events: none; }
  .formats label {
    margin: 0;
    padding: 8px 14px;
    font-weight: 400;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    cursor: pointer;
  }
  .formats input:checked + label {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  .formats input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }

  details { margin-top: 24px; }
  summary { cursor: pointer; color: var(--muted); }
  details[open] summary { margin-bottom: 12px; }
  .hint { margin: 0 0 10px; color: var(--muted); font-size: 14px; }

  .actions { margin-top: 28px; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
  }
  .primary {
    padding: 12px 28px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: 1px solid var(--accent);
  }
  .primary:disabled { opacity: .6; cursor: progress; }

  #error {
    margin: 24px 0 0;
    padding: 12px 14px;
    color: var(--danger);
    border-left: 3px solid var(--danger);
    background: var(--surface);
  }
  #result { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--rule); }
  .result-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .result-head h2 { margin: 0; font-size: 18px; line-height: 1.45; font-weight: 600; }
  .meta { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .ghost {
    flex: none;
    padding: 6px 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
  }
  #summary {
    margin: 20px 0 0;
    max-width: 62ch;
    font-size: 17px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>영상 요약</h1>
  <p class="lead">유튜브 링크를 넣으면 자막을 읽고 원하는 형식으로 정리해요.</p>

  <form id="form">
    <label for="url">유튜브 링크</label>
    <input id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">

    <fieldset>
      <legend>요약 형식</legend>
      <div class="formats" id="formats"></div>
    </fieldset>

    <details id="paste">
      <summary>자막이 안 가져와지면 직접 붙여넣기</summary>
      <p class="hint">영상 설명란의 '더보기' → '스크립트 표시'에서 텍스트를 복사해 붙여넣으세요. 이 칸에 내용이 있으면 링크 대신 이 텍스트를 요약해요.</p>
      <textarea id="transcript" aria-label="자막 텍스트" placeholder="여기에 스크립트를 붙여넣기"></textarea>
    </details>

    <div class="actions">
      <button class="primary" id="submit" type="submit">요약하기</button>
    </div>
  </form>

  <p id="error" role="alert" hidden></p>

  <section id="result" aria-live="polite" hidden>
    <div class="result-head">
      <div>
        <h2 id="title"></h2>
        <p class="meta" id="meta"></p>
      </div>
      <button class="ghost" id="copy" type="button">복사</button>
    </div>
    <div id="summary"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const FORMAT_LABELS = {};

async function loadFormats() {
  let list;
  try {
    list = await (await fetch("/api/formats")).json();
  } catch {
    list = [{ id: "lines10", label: "10줄 요약" }];
  }
  list.forEach((f, i) => {
    FORMAT_LABELS[f.id] = f.label;
    $("formats").insertAdjacentHTML("beforeend",
      `<span><input type="radio" name="format" id="f-${f.id}" value="${f.id}" ${i === 0 ? "checked" : ""}>` +
      `<label for="f-${f.id}">${f.label}</label></span>`);
  });
}

function showError(msg) {
  $("error").textContent = msg;
  $("error").hidden = !msg;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("");
  const url = $("url").value.trim();
  const transcript = $("transcript").value.trim();
  if (!url && !transcript) {
    showError("유튜브 링크를 입력해 주세요.");
    $("url").focus();
    return;
  }
  const format = document.querySelector('input[name="format"]:checked').value;
  const btn = $("submit");
  btn.disabled = true;
  btn.textContent = "정리하는 중…";
  $("result").hidden = true;
  try {
    const res = await fetch("/api/summarize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, transcript, format }),
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || "요약에 실패했어요. 잠시 뒤 다시 시도해 주세요.");
      if (res.status === 422 || res.status === 502) $("paste").open = true;
      return;
    }
    $("title").textContent = data.title || "요약 결과";
    $("meta").textContent =
      FORMAT_LABELS[data.format] + " · " + (data.source === "paste" ? "붙여넣은 자막" : "유튜브 자막");
    $("summary").textContent = data.summary;
    $("copy").textContent = "복사";
    $("result").hidden = false;
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch {
    showError("서버에 연결하지 못했어요. 서버가 켜져 있는지 확인해 주세요.");
  } finally {
    btn.disabled = false;
    btn.textContent = "요약하기";
  }
});

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("summary").textContent);
    $("copy").textContent = "복사됨";
  } catch {
    $("copy").textContent = "복사 실패";
  }
});

loadFormats();
</script>
</body>
</html>
